<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Create New Password — Dheere Studio
    </title>

    <meta
        name="description"
        content="Create a new password for your Dheere Studio account."
    >

    <link
        rel="stylesheet"
        href="homepage.css"
    >

</head>


<body>


    <!-- ==========================================
         RESET PASSWORD PAGE
         ========================================== -->


    <div id="loginPage">


        <!-- Back Button -->

        <button
            class="back-home-link"
            onclick="window.location.href='index.html'"
            type="button"
        >

            ← Back to Dheere Studio

        </button>



        <div class="auth-page-container">


            <div class="auth-card">


                <form
                    class="auth-form"
                    id="resetPasswordForm"
                >


                    <h2>
                        Create New Password
                    </h2>


                    <p class="auth-subtext">

                        Create a new password for your
                        Dheere Studio account.

                    </p>



                    <!-- NEW PASSWORD -->


                    <div class="input-group">


                        <label for="newPassword">

                            New Password

                        </label>


                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >


                    </div>



                    <!-- CONFIRM PASSWORD -->


                    <div class="input-group">


                        <label for="confirmPassword">

                            Confirm New Password

                        </label>


                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >


                    </div>



                    <!-- BUTTON -->


                    <button
                        type="submit"
                        class="button full-width"
                        id="resetSubmitButton"
                    >

                        Update Password

                    </button>



                    <!-- MESSAGE -->


                    <p
                        id="resetMessage"
                        class="feedback-success"
                        style="display:none;"
                    ></p>



                </form>


            </div>


        </div>


    </div>



    <!-- ==========================================
         RESET PASSWORD SCRIPT
         ========================================== -->


    <script>


        // ==========================================
        // CONFIG
        // ==========================================

        const API_BASE =
            "https://dheere-studio.onrender.com";


        // ==========================================
        // GET TOKEN FROM URL
        // ==========================================

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const resetToken =
            urlParams.get("token");



        // ==========================================
        // ELEMENTS
        // ==========================================

        const resetPasswordForm =
            document.getElementById(
                "resetPasswordForm"
            );


        const newPassword =
            document.getElementById(
                "newPassword"
            );


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            );


        const resetSubmitButton =
            document.getElementById(
                "resetSubmitButton"
            );


        const resetMessage =
            document.getElementById(
                "resetMessage"
            );



        // ==========================================
        // SHOW MESSAGE
        // ==========================================

        function showMessage(
            message,
            type = "success"
        ) {

            resetMessage.textContent =
                message;


            resetMessage.style.display =
                "block";


            resetMessage.className =
                type === "error"
                    ? "feedback-error"
                    : "feedback-success";

        }



        // ==========================================
        // CHECK TOKEN
        // ==========================================

        if (!resetToken) {

            resetSubmitButton.disabled =
                true;


            showMessage(

                "This password reset link is invalid or incomplete.",

                "error"

            );

        }



        // ==========================================
        // RESET PASSWORD
        // ==========================================

        resetPasswordForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                if (!resetToken) {

                    showMessage(

                        "This password reset link is invalid.",

                        "error"

                    );

                    return;

                }


                const password =
                    newPassword.value;


                const confirm =
                    confirmPassword.value;


                // ======================================
                // PASSWORD LENGTH
                // ======================================

                if (
                    password.length < 8
                ) {

                    showMessage(

                        "Password must be at least 8 characters long.",

                        "error"

                    );

                    return;

                }


                // ======================================
                // PASSWORD MATCH
                // ======================================

                if (
                    password !== confirm
                ) {

                    showMessage(

                        "Passwords do not match.",

                        "error"

                    );

                    return;

                }


                // ======================================
                // DISABLE BUTTON
                // ======================================

                resetSubmitButton.disabled =
                    true;


                resetSubmitButton.textContent =
                    "Updating...";


                resetMessage.style.display =
                    "none";


                try {

                    const response =
                        await fetch(
                            `${API_BASE}/reset-password`,
                            {

                                method:
                                    "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        token:
                                            resetToken,

                                        password:
                                            password

                                    })

                            }
                        );


                    let result = null;


                    try {

                        result =
                            await response.json();

                    } catch {

                        result = null;

                    }


                    if (!response.ok) {

                        throw new Error(

                            result?.error ||

                            "Unable to reset password."

                        );

                    }


                    if (
                        !result ||
                        result.success !== true
                    ) {

                        throw new Error(

                            result?.error ||

                            "Unable to reset password."

                        );

                    }


                    // ======================================
                    // SUCCESS
                    // ======================================

                    showMessage(

                        "Password updated successfully. Redirecting to login...",

                        "success"

                    );


                    resetPasswordForm.reset();


                    resetSubmitButton.disabled =
                        true;


                    // ======================================
                    // REDIRECT TO LOGIN
                    // ======================================

                    setTimeout(
                        () => {

                            window.location.href =
                                "index.html";

                        },
                        1800
                    );


                } catch (error) {

                    console.error(
                        "Reset Password Error:",
                        error
                    );


                    showMessage(

                        error.message ||

                        "Unable to reset password right now.",

                        "error"

                    );


                } finally {

                    if (
                        !resetSubmitButton.disabled
                    ) {

                        resetSubmitButton.textContent =
                            "Update Password";

                    }

                }

            }
        );


    </script>


</body>

</html>
