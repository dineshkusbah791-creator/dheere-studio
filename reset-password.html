<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Create New Password — Dheere Studio
    </title>

    <meta
        name="description"
        content="Create a new password for your Dheere Studio account."
    >

    <link
        rel="stylesheet"
        href="homepage.css"
    >


    <!-- ==========================================
         PASSWORD TOGGLE STYLES
         ========================================== -->

    <style>

        .password-input-wrapper {

            position: relative;

            width: 100%;

        }


        .password-input-wrapper input {

            width: 100%;

            padding-right: 48px;

            box-sizing: border-box;

        }


        .password-toggle {

            position: absolute;

            right: 10px;

            top: 50%;

            transform: translateY(-50%);

            width: 34px;

            height: 34px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 0;

            border: none;

            background: transparent;

            cursor: pointer;

            color: inherit;

            opacity: 0.65;

            border-radius: 6px;

        }


        .password-toggle:hover {

            opacity: 1;

        }


        .password-toggle:focus-visible {

            outline: 2px solid currentColor;

            outline-offset: 2px;

        }


        .password-toggle svg {

            width: 20px;

            height: 20px;

            pointer-events: none;

        }

    </style>

</head>


<body>


    <!-- ==========================================
         RESET PASSWORD PAGE
         ========================================== -->


    <div id="loginPage">


        <!-- Back Button -->

        <button
            class="back-home-link"
            onclick="window.location.href='index.html'"
            type="button"
        >

            ← Back to Dheere Studio

        </button>



        <div class="auth-page-container">


            <div class="auth-card">


                <form
                    class="auth-form"
                    id="resetPasswordForm"
                >


                    <h2>
                        Create New Password
                    </h2>


                    <p class="auth-subtext">

                        Create a new password for your
                        Dheere Studio account.

                    </p>



                    <!-- ==========================================
                         NEW PASSWORD
                         ========================================== -->


                    <div class="input-group">


                        <label for="newPassword">

                            New Password

                        </label>


                        <div class="password-input-wrapper">


                            <input
                                type="password"
                                id="newPassword"
                                placeholder="Enter new password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                id="toggleNewPassword"
                                aria-label="Show password"
                                title="Show password"
                            >

                                <!-- Eye icon -->

                                <svg
                                    class="eye-icon"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    aria-hidden="true"
                                >

                                    <path
                                        d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                                    ></path>

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="3"
                                    ></circle>

                                </svg>

                            </button>


                        </div>


                    </div>



                    <!-- ==========================================
                         CONFIRM PASSWORD
                         ========================================== -->


                    <div class="input-group">


                        <label for="confirmPassword">

                            Confirm New Password

                        </label>


                        <div class="password-input-wrapper">


                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm new password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                id="toggleConfirmPassword"
                                aria-label="Show password"
                                title="Show password"
                            >

                                <!-- Eye icon -->

                                <svg
                                    class="eye-icon"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    aria-hidden="true"
                                >

                                    <path
                                        d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                                    ></path>

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="3"
                                    ></circle>

                                </svg>

                            </button>


                        </div>


                    </div>



                    <!-- ==========================================
                         BUTTON
                         ========================================== -->


                    <button
                        type="submit"
                        class="button full-width"
                        id="resetSubmitButton"
                    >

                        Update Password

                    </button>



                    <!-- ==========================================
                         MESSAGE
                         ========================================== -->


                    <p
                        id="resetMessage"
                        class="feedback-success"
                        style="display:none;"
                    ></p>



                </form>


            </div>


        </div>


    </div>



    <!-- ==========================================
         RESET PASSWORD SCRIPT
         ========================================== -->


    <script>


        // ==========================================
        // CONFIG
        // ==========================================

        const API_BASE =
            "https://dheere-studio.onrender.com";



        // ==========================================
        // GET TOKEN FROM URL
        // ==========================================

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const resetToken =
            urlParams.get("token");



        // ==========================================
        // ELEMENTS
        // ==========================================

        const resetPasswordForm =
            document.getElementById(
                "resetPasswordForm"
            );


        const newPassword =
            document.getElementById(
                "newPassword"
            );


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            );


        const resetSubmitButton =
            document.getElementById(
                "resetSubmitButton"
            );


        const resetMessage =
            document.getElementById(
                "resetMessage"
            );


        const toggleNewPassword =
            document.getElementById(
                "toggleNewPassword"
            );


        const toggleConfirmPassword =
            document.getElementById(
                "toggleConfirmPassword"
            );



        // ==========================================
        // PASSWORD TOGGLE
        // ==========================================

        function setupPasswordToggle(
            input,
            button
        ) {

            button.addEventListener(
                "click",
                () => {

                    const isPassword =
                        input.type === "password";


                    input.type =
                        isPassword
                            ? "text"
                            : "password";


                    button.setAttribute(
                        "aria-label",
                        isPassword
                            ? "Hide password"
                            : "Show password"
                    );


                    button.setAttribute(
                        "title",
                        isPassword
                            ? "Hide password"
                            : "Show password"
                    );


                    // ======================================
                    // CHANGE ICON
                    // ======================================

                    if (isPassword) {

                        button.innerHTML = `

                            <svg
                                class="eye-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >

                                <path
                                    d="M3 3l18 18"
                                ></path>

                                <path
                                    d="M10.6 10.6a2 2 0 0 0 2.8 2.8"
                                ></path>

                                <path
                                    d="M9.9 4.3A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a17.3 17.3 0 0 1-3.1 4.2"
                                ></path>

                                <path
                                    d="M6.6 6.6C3.8 8.4 2 12 2 12s3.5 8 10 8c1.8 0 3.4-.5 4.8-1.2"
                                ></path>

                            </svg>

                        `;

                    } else {

                        button.innerHTML = `

                            <svg
                                class="eye-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >

                                <path
                                    d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                                ></path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                ></circle>

                            </svg>

                        `;

                    }

                }
            );

        }



        setupPasswordToggle(
            newPassword,
            toggleNewPassword
        );


        setupPasswordToggle(
            confirmPassword,
            toggleConfirmPassword
        );



        // ==========================================
        // SHOW MESSAGE
        // ==========================================

        function showMessage(
            message,
            type = "success"
        ) {

            resetMessage.textContent =
                message;


            resetMessage.style.display =
                "block";


            resetMessage.className =
                type === "error"
                    ? "feedback-error"
                    : "feedback-success";

        }



        // ==========================================
        // CHECK TOKEN
        // ==========================================

        if (!resetToken) {

            resetSubmitButton.disabled =
                true;


            showMessage(

                "This password reset link is invalid or incomplete.",

                "error"

            );

        }



        // ==========================================
        // RESET PASSWORD
        // ==========================================

        resetPasswordForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                if (!resetToken) {

                    showMessage(

                        "This password reset link is invalid.",

                        "error"

                    );

                    return;

                }


                const password =
                    newPassword.value;


                const confirm =
                    confirmPassword.value;


                // ======================================
                // PASSWORD LENGTH
                // ======================================

                if (
                    password.length < 8
                ) {

                    showMessage(

                        "Password must be at least 8 characters long.",

                        "error"

                    );

                    return;

                }


                // ======================================
                // PASSWORD MATCH
                // ======================================

                if (
                    password !== confirm
                ) {

                    showMessage(

                        "Passwords do not match.",

                        "error"

                    );

                    return;

                }


                // ======================================
                // DISABLE BUTTON
                // ======================================

                resetSubmitButton.disabled =
                    true;


                resetSubmitButton.textContent =
                    "Updating...";


                resetMessage.style.display =
                    "none";


                try {

                    const response =
                        await fetch(
                            `${API_BASE}/reset-password`,
                            {

                                method:
                                    "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        token:
                                            resetToken,

                                        password:
                                            password

                                    })

                            }
                        );


                    let result = null;


                    try {

                        result =
                            await response.json();

                    } catch {

                        result = null;

                    }


                    if (!response.ok) {

                        throw new Error(

                            result?.error ||

                            "Unable to reset password."

                        );

                    }


                    if (
                        !result ||
                        result.success !== true
                    ) {

                        throw new Error(

                            result?.error ||

                            "Unable to reset password."

                        );

                    }


                    // ======================================
                    // SUCCESS
                    // ======================================

                    showMessage(

                        "Password updated successfully. Redirecting to login...",

                        "success"

                    );


                    resetPasswordForm.reset();


                    resetSubmitButton.disabled =
                        true;


                    // ======================================
                    // REDIRECT TO LOGIN
                    // ======================================

                    setTimeout(
                        () => {

                            window.location.href =
                                "index.html";

                        },
                        1800
                    );


                } catch (error) {

                    console.error(
                        "Reset Password Error:",
                        error
                    );


                    showMessage(

                        error.message ||

                        "Unable to reset password right now.",

                        "error"

                    );


                } finally {

                    if (
                        !resetSubmitButton.disabled
                    ) {

                        resetSubmitButton.textContent =
                            "Update Password";

                    }

                }

            }
        );


    </script>


</body>

</html>
