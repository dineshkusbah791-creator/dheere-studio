<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Dheere Mood — Dheere Studio
    </title>

    <meta
        name="description"
        content="Choose the atmosphere of Dheere Studio."
    >

    <link
        rel="stylesheet"
        href="homepage.css"
    >


    <style>

        /* =====================================================
           DHEERE MOOD — CINEMATIC V7
           -----------------------------------------------------
           7 atmospheric environments

           01 Original
           02 Forest
           03 Ocean
           04 Ember
           05 Midnight
           06 Prism
           07 Universe

           Design principle:
           Quiet interface.
           Sophisticated motion.
           High visual depth.
           ===================================================== */


        /* =====================================================
           ROOT
           ===================================================== */

        :root {

            --page-bg:
                #07080a;

            --page-text:
                #f6f7f9;

            --page-copy:
                #9099a7;

            --page-muted:
                #707a88;

            --page-line:
                rgba(
                    255,
                    255,
                    255,
                    .052
                );

        }


        /* =====================================================
           RESET
           ===================================================== */

        *,
        *::before,
        *::after {

            box-sizing:
                border-box;

        }


        html {

            scroll-behavior:
                smooth;

        }


        body {

            margin:
                0;

            min-height:
                100vh;

            background:
                #07080a;

            color:
                var(--page-text);

            overflow-x:
                hidden;

            -webkit-font-smoothing:
                antialiased;

            -moz-osx-font-smoothing:
                grayscale;

            text-rendering:
                optimizeLegibility;

        }


        button {

            font:
                inherit;

        }


        /* =====================================================
           PAGE
           ===================================================== */

        .mood-page {

            position:
                relative;

            min-height:
                100vh;

            padding:
                92px 24px 86px;

            overflow:
                hidden;

            background:

                radial-gradient(
                    circle at 11% 0%,
                    rgba(
                        145,
                        129,
                        239,
                        .028
                    ),
                    transparent
                    25%
                ),

                radial-gradient(
                    circle at 94% 98%,
                    rgba(
                        255,
                        255,
                        255,
                        .012
                    ),
                    transparent
                    25%
                ),

                linear-gradient(
                    180deg,
                    #08090b 0%,
                    #0a0c0f 51%,
                    #08090b 100%
                );

        }


        .mood-page::before {

            content:
                "";

            position:
                fixed;

            width:
                710px;

            height:
                710px;

            top:
                -430px;

            right:
                -320px;

            border-radius:
                50%;

            background:

                radial-gradient(
                    circle,
                    rgba(
                        146,
                        128,
                        247,
                        .045
                    ),
                    transparent
                    69%
                );

            filter:
                blur(34px);

            pointer-events:
                none;

            animation:
                pageGlowA
                25s
                ease-in-out
                infinite
                alternate;

        }


        .mood-page::after {

            content:
                "";

            position:
                fixed;

            width:
                540px;

            height:
                540px;

            left:
                -320px;

            bottom:
                -300px;

            border-radius:
                50%;

            background:

                radial-gradient(
                    circle,
                    rgba(
                        255,
                        255,
                        255,
                        .015
                    ),
                    transparent
                    70%
                );

            filter:
                blur(40px);

            pointer-events:
                none;

            animation:
                pageGlowB
                30s
                ease-in-out
                infinite
                alternate;

        }


        @keyframes pageGlowA {

            from {

                transform:
                    translate3d(
                        0,
                        0,
                        0
                    )
                    scale(1);

            }

            to {

                transform:
                    translate3d(
                        -34px,
                        42px,
                        0
                    )
                    scale(1.08);

            }

        }


        @keyframes pageGlowB {

            from {

                transform:
                    translate3d(
                        0,
                        0,
                        0
                    )
                    scale(1);

            }

            to {

                transform:
                    translate3d(
                        42px,
                        -31px,
                        0
                    )
                    scale(1.08);

            }

        }


        .mood-container {

            position:
                relative;

            z-index:
                2;

            width:
                min(
                    100%,
                    1100px
                );

            margin:
                0 auto;

        }


        /* =====================================================
           BACK
           ===================================================== */

        .mood-back {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                10px;

            margin-bottom:
                69px;

            color:
                #626c7a;

            text-decoration:
                none;

            font-size:
                .81rem;

            letter-spacing:
                -.012em;

            transition:

                color
                .3s
                ease,

                transform
                .38s
                cubic-bezier(
                    .22,
                    1,
                    .36,
                    1
                );

        }


        .mood-back .arrow {

            display:
                inline-flex;

            transition:
                transform
                .38s
                cubic-bezier(
                    .22,
                    1,
                    .36,
                    1
                );

        }


        .mood-back:hover {

            color:
                #f3f5f7;

            transform:
                translateX(
                    -2px
                );

        }


        .mood-back:hover
        .arrow {

            transform:
                translateX(
                    -3px
                );

        }


        /* =====================================================
           HEADER
           ===================================================== */

        .mood-header {

            max-width:
                730px;

            margin-bottom:
                58px;

        }


        .mood-eyebrow {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                10px;

            margin-bottom:
                18px;

            color:
                #6d7684;

            font-size:
                .63rem;

            font-weight:
                600;

            letter-spacing:
                .19em;

            text-transform:
                uppercase;

        }


        .mood-eyebrow::before {

            content:
                "";

            width:
                25px;

            height:
                1px;

            background:
                currentColor;

            opacity:
                .60;

        }


        .mood-header h1 {

            margin:
                0 0 18px;

            color:
                #ffffff;

            font-size:
                clamp(
                    3.55rem,
                    7.7vw,
                    6.4rem
                );

            font-weight:
                500;

            line-height:
                .85;

            letter-spacing:
                -.074em;

        }


        .mood-header p {

            max-width:
                620px;

            margin:
                0;

            color:
                #89929f;

            font-size:
                .94rem;

            line-height:
                1.86;

        }


        /* =====================================================
           GRID
           ===================================================== */

        .mood-grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap:
                16px;

        }


        /* =====================================================
           CARD
           ===================================================== */

        .mood-card {

            --accent:
                #edf0f3;

            --title:
                #f6f8fa;

            --copy:
                #9da6b1;

            --number:
                #687281;

            --card-shadow:
                rgba(
                    0,
                    0,
                    0,
                    .22
                );

            position:
                relative;

            min-height:
                340px;

            padding:
                25px;

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                space-between;

            overflow:
                hidden;

            appearance:
                none;

            -webkit-appearance:
                none;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .060
                );

            border-radius:
                18px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .015
                );

            color:
                var(--title);

            text-align:
                left;

            cursor:
                pointer;

            isolation:
                isolate;

            transform:
                translateZ(0);

            transition:

                transform
                .62s
                cubic-bezier(
                    .22,
                    1,
                    .36,
                    1
                ),

                border-color
                .58s
                ease,

                box-shadow
                .75s
                cubic-bezier(
                    .22,
                    1,
                    .36,
                    1
                ),

                background
                .75s
                ease;

        }


        .mood-card::before {

            content:
                "";

            position:
                absolute;

            inset:
                0;

            background:

                linear-gradient(
                    126deg,
                    rgba(
                        255,
                        255,
                        255,
                        .050
                    ),
                    transparent
                    21%,
                    transparent
                    77%,
                    rgba(
                        255,
                        255,
                        255,
                        .008
                    )
                );

            pointer-events:
                none;

            opacity:
                .74;

            z-index:
                -5;

        }


        .mood-card::after {

            content:
                "";

            position:
                absolute;

            width:
                380px;

            height:
                250px;

            top:
                -184px;

            right:
                -140px;

            border-radius:
                50%;

            background:

                radial-gradient(
                    circle,
                    color-mix(
                        in srgb,
                        var(--accent)
                        7%,
                        transparent
                    ),
                    transparent
                    69%
                );

            filter:
                blur(33px);

            pointer-events:
                none;

            opacity:
                .44;

            z-index:
                -4;

            transition:

                transform
                1.15s
                cubic-bezier(
                    .22,
                    1,
                    .36,
                    1
                ),

                opacity
                .75s
                ease;

        }


        .mood-card:hover {

            transform:
                translate3d(
                    0,
                    -6px,
                    0
                );

            border-color:

                color-mix(
                    in srgb,
                    var(--accent)
                    24%,
                    rgba(
                        255,
                        255,
                        255,
                        .04
                    )
                );

            box-shadow:

                0 36px 90px
                rgba(
                    0,
                    0,
                    0,
                    .26
                );

        }


        .mood-card:hover::after {

            transform:
                translate3d(
                    -30px,
                    27px,
                    0
                );

            opacity:
                .72;

        }


        .mood-card.active {

            border-color:

                color-mix(
                    in srgb,
                    var(--accent)
                    67%,
                    transparent
                );

            box-shadow:

                inset
                0 0 0 1px
                color-mix(
                    in srgb,
                    var(--accent)
                    31%,
                    transparent
                ),

                0 31px 88px
                var(--card-shadow);

        }


        .mood-card.wide {

            grid-column:
                span 2;

            min-height:
                375px;

        }


        .mood-card:focus-visible {

            outline:
                1px solid
                var(--accent);

            outline-offset:
                3px;

        }


        /* =====================================================
           TOP
           ===================================================== */

        .mood-card-top {

            position:
                relative;

            z-index:
                300;

            display:
                flex;

            align-items:
                flex-start;

            justify-content:
                space-between;

        }


        .mood-number {

            color:
                var(--number);

            font-size:
                .60rem;

            font-weight:
                600;

            letter-spacing:
                .16em;

        }


        .mood-selected {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                6px;

            color:
                var(--accent);

            font-size:
                .57rem;

            font-weight:
                600;

            opacity:
                0;

            transform:
                translateY(
                    -4px
                );

            transition:

                opacity
                .32s
                ease,

                transform
                .38s
                cubic-bezier(
                    .22,
                    1,
                    .36,
                    1
                );

        }


        .mood-selected::before {

            content:
                "";

            width:
                4px;

            height:
                4px;

            border-radius:
                50%;

            background:
                currentColor;

            box-shadow:
                0 0 10px
                currentColor;

        }


        .mood-card.active
        .mood-selected {

            opacity:
                1;

            transform:
                translateY(
                    0
                );

        }


        /* =====================================================
           PREVIEW
           ===================================================== */

        .mood-preview {

            position:
                relative;

            height:
                152px;

            margin:
                17px 0 24px;

            overflow:
                hidden;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .034
                );

            border-radius:
                13px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    .11
                );

            isolation:
                isolate;

        }


        .mood-preview::before {

            content:
                "";

            position:
                absolute;

            inset:
                0;

            background:

                linear-gradient(
                    180deg,
                    rgba(
                        255,
                        255,
                        255,
                        .018
                    ),
                    transparent
                    35%,
                    transparent
                    72%,
                    rgba(
                        0,
                        0,
                        0,
                        .13
                    )
                );

            pointer-events:
                none;

            z-index:
                900;

        }


        .mood-preview::after {

            content:
                "";

            position:
                absolute;

            inset:
                0;

            background:

                radial-gradient(
                    ellipse at center,
                    transparent 37%,
                    rgba(
                        0,
                        0,
                        0,
                        .17
                    )
                    100%
                );

            pointer-events:
                none;

            z-index:
                901;

        }


        /* =====================================================
           01 — ORIGINAL
           ===================================================== */

        .mood-original {

            --accent:
                #edf1f4;

            --title:
                #f6f8fa;

            --copy:
                #a2abb7;

            --number:
                #697383;

            --card-shadow:
                rgba(
                    255,
                    255,
                    255,
                    .023
                );

            background:

                radial-gradient(
                    circle at 80% 9%,
                    rgba(
                        255,
                        255,
                        255,
                        .032
                    ),
                    transparent
                    28%
                ),

                linear-gradient(
                    145deg,
                    #151719,
                    #0e1012
                );

        }


        .original-horizon {

            position:
                absolute;

            left:
                7%;

            right:
                7%;

            top:
                55%;

            height:
                1px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(
                        255,
                        255,
                        255,
                        .29
                    ),
                    transparent
                );

            box-shadow:
                0 0 18px
                rgba(
                    255,
                    255,
                    255,
                    .045
                );

            animation:
                originalHorizon
                8s
                ease-in-out
                infinite
                alternate;

        }


        .original-orb {

            position:
                absolute;

            top:
                50%;

            right:
                17%;

            width:
                46px;

            height:
                46px;

            transform:
                translateY(
                    -50%
                );

            border-radius:
                50%;

            background:

                radial-gradient(
                    circle at 31% 28%,
                    rgba(
                        255,
                        255,
                        255,
                        .20
                    ),
                    rgba(
                        255,
                        255,
                        255,
                        .05
                    )
                    48%,
                    transparent
                    72%
                );

            box-shadow:
                0 0 34px
                rgba(
                    255,
                    255,
                    255,
                    .045
                );

            animation:
                originalOrb
                7s
                ease-in-out
                infinite
                alternate;

        }


        @keyframes originalHorizon {

            from {

                opacity:
                    .20;

                transform:
                    translateX(
                        -9px
                    );

            }

            to {

                opacity:
                    .57;

                transform:
                    translateX(
                        11px
                    );

            }

        }


        @keyframes originalOrb {

            from {

                transform:
                    translate(
                        0,
                        -50%
                    )
                    scale(.95);

            }

            to {

                transform:
                    translate(
                        -4px,
                        calc(
                            -50% - 3px
                        )
                    )
                    scale(1.04);

            }

        }


        /* =====================================================
           02 — FOREST
           ===================================================== */

        .mood-forest {

            --accent:
                #65ce7f;

            --title:
                #eef9f1;

            --copy:
                #93a99a;

            --number:
                #607667;

            --card-shadow:
                rgba(
                    0,
                    58,
                    18,
                    .23
                );

            background:

                radial-gradient(
                    ellipse at 7% 4%,
                    rgba(
                        51,
                        132,
                        71,
                        .21
                    ),
                    transparent
                    31%
                ),

                radial-gradient(
                    ellipse at 95% 97%,
                    rgba(
                        33,
                        102,
                        53,
                        .17
                    ),
                    transparent
                    32%
                ),

                linear-gradient(
                    145deg,
                    #0c1b11,
                    #08130c
                );

        }


        .forest-canopy {

            position:
                absolute;

            top:
                -14px;

            left:
                -5%;

            right:
                -5%;

            height:
                75px;

            opacity:
                .72;

            background:

                radial-gradient(
                    ellipse at 7% 100%,
                    rgba(
                        76,
                        150,
                        85,
                        .39
                    )
                    0 18%,
                    transparent
                    19%
                ),

                radial-gradient(
                    ellipse at 28% 100%,
                    rgba(
                        45,
                        118,
                        62,
                        .51
                    )
                    0 23%,
                    transparent
                    24%
                ),

                radial-gradient(
                    ellipse at 50% 100%,
                    rgba(
                        61,
                        137,
                        72,
                        .39
                    )
                    0 22%,
                    transparent
                    23%
                ),

                radial-gradient(
                    ellipse at 73% 100%,
                    rgba(
                        42,
                        107,
                        59,
                        .48
                    )
                    0 24%,
                    transparent
                    25%
                ),

                radial-gradient(
                    ellipse at 94% 100%,
                    rgba(
                        69,
                        140,
                        78,
                        .35
                    )
                    0 20%,
                    transparent
                    21%
                );

            animation:
                forestCanopy
                17s
                ease-in-out
                infinite
                alternate;

        }


        .forest-depth {

            position:
                absolute;

            left:
                10%;

            right:
                10%;

            bottom:
                21px;

            height:
                39px;

            background:

                radial-gradient(
                    ellipse at 21% 50%,
                    rgba(
                        56,
                        136,
                        68,
                        .15
                    ),
                    transparent
                    32%
                ),

                radial-gradient(
                    ellipse at 53% 50%,
                    rgba(
                        82,
                        156,
                        86,
                        .11
                    ),
                    transparent
                    33%
                ),

                radial-gradient(
                    ellipse at 82% 50%,
                    rgba(
                        42,
                        109,
                        57,
                        .16
                    ),
                    transparent
                    32%
                );

            filter:
                blur(8px);

        }


        .forest-haze {

            position:
                absolute;

            left:
                -15%;

            right:
                -15%;

            bottom:
                0;

            height:
                57px;

            background:
                radial-gradient(
                    ellipse,
                    rgba(
                        166,
                        201,
                        175,
                        .10
                    ),
                    transparent
                    69%
                );

            filter:
                blur(9px);

            animation:
                forestHaze
                12s
                ease-in-out
                infinite
                alternate;

        }


        .forest-leaf {

            position:
                absolute;

            width:
                13px;

            height:
                7px;

            border-radius:
                100% 0 100% 0;

            background:
                #68cb83;

            opacity:
                .34;

            animation:
                forestLeaf
                var(--speed,7s)
                ease-in-out
                infinite
                alternate;

        }


        .forest-leaf.a {

            left:
                22%;

            top:
                28%;

            --x:
                10px;

            --y:
                8px;

            --speed:
                5.3s;

        }


        .forest-leaf.b {

            left:
                49%;

            top:
                47%;

            --x:
                -7px;

            --y:
                9px;

            --speed:
                6.5s;

        }


        .forest-leaf.c {

            right:
                17%;

            top:
                24%;

            --x:
                8px;

            --y:
                11px;

            --speed:
                5.9s;

        }


        @keyframes forestCanopy {

            from {

                transform:
                    translateX(
                        -8px
                    );

            }

            to {

                transform:
                    translateX(
                        8px
                    );

            }

        }


        @keyframes forestHaze {

            from {

                transform:
                    translateX(
                        -4%
                    );

                opacity:
                    .36;

            }

            to {

                transform:
                    translateX(
                        5%
                    );

                opacity:
                    .75;

            }

        }


        @keyframes forestLeaf {

            from {

                transform:
                    translate(
                        0,
                        0
                    )
                    rotate(
                        22deg
                    );

                opacity:
                    .08;

            }

            to {

                transform:
                    translate(
                        var(--x),
                        var(--y)
                    )
                    rotate(
                        60deg
                    );

                opacity:
                    .50;

            }

        }


        /* =====================================================
           03 — OCEAN
           ===================================================== */

        .mood-ocean {

            --accent:
                #6ba9ee;

            --title:
                #edf7ff;

            --copy:
                #91a7bb;

            --number:
                #617990;

            --card-shadow:
                rgba(
                    0,
                    40,
                    91,
                    .24
                );

            background:

                radial-gradient(
                    ellipse at 13% 5%,
                    rgba(
                        50,
                        121,
                        194,
                        .23
                    ),
                    transparent
                    31%
                ),

                radial-gradient(
                    ellipse at 91% 91%,
                    rgba(
                        30,
                        83,
                        157,
                        .18
                    ),
                    transparent
                    32%
                ),

                linear-gradient(
                    180deg,
                    #0a1929,
                    #06111c
                );

        }


        .ocean-depth {

            position:
                absolute;

            inset:
                0;

            background:

                linear-gradient(
                    180deg,
                    rgba(
                        105,
                        187,
                        242,
                        .055
                    ),
                    transparent
                    37%,
                    rgba(
                        0,
                        0,
                        0,
                        .14
                    )
                );

        }


        .ocean-light {

            position:
                absolute;

            top:
                -28%;

            left:
                16%;

            width:
                82px;

            height:
                190px;

    <script>

        /* =====================================================
           DHEERE MOOD — SELECTION SYSTEM
           ===================================================== */


        "use strict";


        /* =====================================================
           ELEMENTS
           ===================================================== */

        const moodCards =
            document.querySelectorAll(
                ".mood-card"
            );


        /* =====================================================
           STORAGE
           ===================================================== */

        const STORAGE_KEY =
            "dheereMood";


        /* =====================================================
           VALID MOODS
           ===================================================== */

        const VALID_MOODS = [

            "original",
            "forest",
            "ocean",
            "ember",
            "midnight",
            "prism",
            "universe"

        ];


        /* =====================================================
           GET SAVED MOOD
           ===================================================== */

        function getSavedMood() {

            let savedMood =
                null;


            try {

                savedMood =
                    localStorage.getItem(
                        STORAGE_KEY
                    );

            } catch (
                error
            ) {

                savedMood =
                    null;

            }


            if (
                VALID_MOODS.includes(
                    savedMood
                )
            ) {

                return savedMood;

            }


            return "original";

        }


        /* =====================================================
           SAVE
           ===================================================== */

        function saveMood(
            mood
        ) {

            try {

                localStorage.setItem(
                    STORAGE_KEY,
                    mood
                );

            } catch (
                error
            ) {

                /*
                 * Storage failure should never
                 * break the visual selector.
                 */

            }

        }


        /* =====================================================
           ACTIVE STATE
           ===================================================== */

        function updateSelectedState(
            mood
        ) {

            moodCards.forEach(
                function (
                    card
                ) {

                    const active =
                        card.dataset.mood ===
                        mood;


                    card.classList.toggle(
                        "active",
                        active
                    );


                    card.setAttribute(
                        "aria-pressed",
                        active
                            ? "true"
                            : "false"
                    );

                }
            );

        }


        /* =====================================================
           SELECT
           ===================================================== */

        function selectMood(
            mood
        ) {

            if (
                !VALID_MOODS.includes(
                    mood
                )
            ) {

                return;

            }


            saveMood(
                mood
            );


            updateSelectedState(
                mood
            );


            /*
             * Small visual confirmation.
             */

            window.setTimeout(
                function () {

                    window.location.href =
                        "index.html";

                },
                390
            );

        }


        /* =====================================================
           INITIAL STATE
           ===================================================== */

        updateSelectedState(
            getSavedMood()
        );


        /* =====================================================
           CLICK EVENTS
           ===================================================== */

        moodCards.forEach(
            function (
                card
            ) {

                card.addEventListener(
                    "click",
                    function () {

                        selectMood(
                            card.dataset.mood
                        );

                    }
                );

            }
        );


        /* =====================================================
           KEYBOARD
           ===================================================== */

        moodCards.forEach(
            function (
                card
            ) {

                card.addEventListener(
                    "keydown",
                    function (
                        event
                    ) {

                        if (
                            event.key ===
                            "Enter"
                        ) {

                            event.preventDefault();

                            selectMood(
                                card.dataset.mood
                            );

                        }


                        if (
                            event.key ===
                            " "
                        ) {

                            event.preventDefault();

                            selectMood(
                                card.dataset.mood
                            );

                        }

                    }
                );

            }
        );


    </script>
