<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Search people on Dheere Studio."
    >

    <title>Search — Dheere Studio</title>

    <link
        rel="stylesheet"
        href="../homepage.css"
    >

    <link
        rel="stylesheet"
        href="./search.css"
    >

</head>


<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header>

        <nav
            class="navbar"
            aria-label="Main navigation"
        >

            <!-- LOGO -->

            <div class="nav-logo">

                <a
                    href="../index.html"
                    aria-label="Dheere Studio homepage"
                >
                    Dheere Studio
                </a>

            </div>


            <!-- MAIN NAVIGATION -->

            <div class="nav-links">

                <ul>

                    <li>
                        <a href="../index.html#projects">
                            Projects
                        </a>
                    </li>

                    <li>
                        <a href="../article.html">
                            Articles
                        </a>
                    </li>

                    <li>
                        <a href="../Community/community.html">
                            Community
                        </a>
                    </li>

                    <li>
                        <a href="../about.html">
                            About
                        </a>
                    </li>

                    <li>
                        <a href="../index.html#feedback">
                            Feedback
                        </a>
                    </li>

                    <li>
                        <a
                            href="../mood.html"
                            class="dheere-mood-link"
                        >
                            Dheere Mood
                        </a>
                    </li>

                </ul>

            </div>

        </nav>

    </header>


    <!-- =====================================================
         SEARCH PAGE
         ===================================================== -->

    <main>

        <section
            class="search-page"
            aria-labelledby="searchPageTitle"
        >

            <div class="search-page-header">

                <span class="section-kicker">
                    Discover
                </span>

                <h1 id="searchPageTitle">
                    Search
                </h1>

                <p>
                    Find people on Dheere Studio.
                </p>

            </div>


            <!-- =================================================
                 SEARCH BOX
                 ================================================= -->

            <div
                class="search-page-container"
                id="userSearch"
            >

                <div class="search-page-input-wrapper">

                    <input
                        type="text"
                        id="userSearchInput"
                        placeholder="Search people..."
                        autocomplete="off"
                        autocapitalize="off"
                        spellcheck="false"
                        aria-label="Search users"
                        aria-autocomplete="list"
                        aria-controls="searchResults"
                    >

                    <button
                        id="userSearchButton"
                        type="button"
                        aria-label="Search people"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >

                            <circle
                                cx="11"
                                cy="11"
                                r="7"
                            ></circle>

                            <path
                                d="m20 20-4-4"
                            ></path>

                        </svg>

                    </button>

                </div>


                <!-- SEARCH RESULTS -->

                <div
                    id="searchResults"
                    class="search-results"
                    role="listbox"
                    aria-label="User search results"
                ></div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer>

        <div class="footer-content">

            <p>
                © Dheere Studio
            </p>

        </div>

    </footer>


    <script
        type="module"
        src="./dist/search.js"
    ></script>

</body>

</html>
